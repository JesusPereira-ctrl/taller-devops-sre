name: Taller

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Obtener el código
        uses: actions/checkout@v4

      - name: Preparar carpeta en el servidor y copiar archivos
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.IP_PUBLICA }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.KEY }}
          source: "."
          target: "/home/${{ secrets.USERNAME }}/proyecto1"
          strip_components: 0
          overwrite: true

      - name: Levantar contenedor
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.IP_PUBLICA }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.KEY }}
          script: |
            set -e
            cd "/home/${{ secrets.USERNAME }}/proyecto1"
            docker compose down
            docker compose up -d --build
